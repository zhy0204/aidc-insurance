<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIDC 生態保費試算 (極簡白藍版)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --ink:#0f172a;
  --mut:#64748b;
  --seg:#f1f5f9;
  --line:#e2e8f0;
  --hero:#eff6ff;
  --hero-border:#bfdbfe;
  --org:#f59e0b;
  --grn:#0d9488;
  --blu:#2563eb;
  --blu-dark:#1d4ed8;
  --red:#f43f5e;
  --yel:#d97706;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text","Noto Sans TC",sans-serif;font-size:14px;line-height:1.5}
.w{max-width:1080px;margin:auto;padding:24px 20px 64px}

/* 簡約頂部標頭排版 */
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand h1{font-size:clamp(24px,4vw,32px);margin:0;font-weight:800;letter-spacing:-0.5px;color:var(--ink)}
.brand .sub{color:var(--mut);font-size:14px;margin:4px 0 0}

/* 膠囊型分頁導覽 */
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;overflow-x:auto;box-shadow:0 1px 3px rgba(15,23,42,0.03)}
.tabs button{border:0;background:none;color:var(--mut);padding:8px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.tabs button:hover{color:var(--blu);background:var(--seg)}
.tabs button.on{background:var(--blu);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,0.25)}

h2{font-size:clamp(20px,3.5vw,26px);margin:28px 0 6px;font-weight:800;color:var(--ink);letter-spacing:-0.3px}
.sec-desc{color:var(--mut);font-size:13.5px;margin:0 0 18px}

/* 網格與卡片 */
.g{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}.g2.stack{grid-template-columns:1fr}}
@media(max-width:500px){.g4,.g2{grid-template-columns:1fr}}

.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0;box-shadow:0 2px 8px rgba(15,23,42,0.02)}
.k{color:var(--mut);font-size:12.5px;display:flex;align-items:center;gap:6px;font-weight:500}
.d{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.big{font-size:30px;font-weight:800;letter-spacing:-0.8px;margin:6px 0 4px;color:var(--ink);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big small{font-size:14px;font-weight:600;color:var(--mut)}
.pct-badge{font-size:13px;font-weight:700;padding:3px 9px;border-radius:8px;letter-spacing:0}

/* 清透白藍重點看板 */
.hero-box{background:linear-gradient(135deg,#eff6ff 0%,#ffffff 100%);border:1px solid var(--hero-border);border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 4px 12px rgba(37,99,235,0.04)}
.hero-box .k{color:#1e40af}

.pill{display:inline-block;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700}
.lo{background:#dcfce7;color:#15803d}
.mi{background:#fef3c7;color:#b45309}
.hi{background:#fee2e2;color:#b91c1c}
.gy{background:var(--seg);color:var(--mut)}

/* 評估頁專用左右對照區塊 */
.ba-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
@media(max-width:560px){.ba-grid{grid-template-columns:1fr}}
.ba-col{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px}
.ba-col.after{background:#eff6ff66;border-color:#bfdbfe}

.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;margin:8px 0;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:15px;font-weight:700;padding:7px 0;border-radius:7px;cursor:pointer;transition:all .15s}
.seg button:hover{color:var(--blu)}
.seg button.on{background:var(--blu);color:#fff;box-shadow:0 1px 4px rgba(37,99,235,0.25)}
.ba-col:not(.after) .seg button.on{background:#475569;color:#fff;box-shadow:0 1px 4px rgba(71,85,105,0.25)}

.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.hd{font-weight:700;font-size:16px;color:var(--ink)}
.lv{color:var(--mut);font-size:12px;min-height:32px;line-height:1.4}
.foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;margin-top:12px;align-items:center}
.fm{background:var(--seg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mut);margin-top:16px;line-height:1.7;overflow-x:auto}

.gauges{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:12px}
@media(max-width:600px){.gauges{grid-template-columns:1fr}}

.in{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.in:last-child{border:0}
input[type=number],input[type=text],input[type=date],textarea{background:var(--seg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--blu);font:inherit;font-weight:700;width:100px;text-align:right;transition:border-color .15s}
input:focus,textarea:focus{outline:none;border-color:var(--blu);background:#fff}
input[type=date]{width:auto;text-align:left}
textarea{width:100%;text-align:left;color:var(--ink);font-weight:400;min-height:105px;line-height:1.6}

.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;margin:0 6px 8px 0;transition:all .15s}
.chips button:hover{border-color:var(--blu);color:var(--blu)}
.chips button.on{background:var(--blu);color:#fff;border-color:var(--blu)}

table{width:100%;border-collapse:collapse}
th,td{text-align:right;padding:11px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px;background:var(--seg)}
tr.hl td{background:#eff6ff}
.tw{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}

/* 資金來源比例條 */
.bar{height:32px;border-radius:12px;display:flex;overflow:hidden;margin:16px 0 6px;background:var(--seg);border:1px solid var(--line)}
.bar-seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;transition:width .3s ease;overflow:hidden;white-space:nowrap}

.btn{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;color:#fff;background:var(--blu);cursor:pointer;transition:background .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--blu-dark)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--blu);color:var(--blu)}
.btn.danger{background:#fee2e2;color:#b91c1c}
.btn.danger:hover{background:#fecaca}
.btn:disabled{opacity:.45;cursor:not-allowed}

.tag{background:#dbeafe;color:#1d4ed8;border-radius:99px;padding:4px 10px;font-weight:700;font-size:11.5px}
.path{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;margin:10px 0}
.path span.t{background:#dbeafe;color:#1e40af;border-radius:8px;padding:5px 10px;font-weight:700;font-size:12.5px}
.path b.r{margin-left:auto;text-align:right}

.ai-banner{display:flex;gap:10px;align-items:center;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:14px;padding:12px 18px;margin-bottom:16px;font-weight:600;font-size:13.5px}
.ring{position:relative;width:84px;height:84px;flex:none}
.rem{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.rem:last-child{border:0}
.ev{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;margin:10px 0}
blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--blu);background:#fff;border-radius:6px;font-size:13px;color:var(--ink)}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.imgs img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.err{background:#fee2e2;color:#b91c1c;padding:10px 14px;border-radius:10px;font-size:13px;margin:10px 0;font-weight:600}
.note-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);color:var(--mut);font-size:12px}
</style></head><body><div class="w">

<div class="topbar">
  <div class="brand">
    <h1>AIDC 生態保費試算</h1>
    <p class="sub">把生態風險，轉化為透明可量化的保費機制</p>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="g g4" id="sum"></div>

<div id="pane"></div>

<div class="note-bar">
  <div><b>模擬情境說明：</b>以虛擬 AIDC 基地示範；分數、費率與成本皆為假設參數，並非實際精算報價。AI 請求經由安全後端代理。</div>
  <div style="display:flex;gap:8px">
    <button class="btn sec" id="expJ">匯出 JSON</button>
    <button class="btn sec" id="expC">匯出 CSV</button>
  </div>
</div>

</div>
<script>
const $=s=>document.querySelector(s);
const IND=[
{k:'h',n:'棲地敏感性',w:30,c:'#0d9488',i:'🍃',L:['人工化基地且未辨識敏感棲地','一般綠地','鄰接自然水域或半自然棲地','影響範圍涉及重要棲地','涉及保護區 or 保育物種重要棲地'],r:'棲地'},
{k:'v',n:'植被移除比例',w:25,c:'#059669',i:'🌳',L:['低於 10%','10% 至未滿 25%','25% 至未滿 50%','50% 至 75%','高於 75%'],r:'植被'},
{k:'r',n:'逕流與透水影響',w:15,c:'#2563eb',i:'💧',L:['透水及逕流控制完善並有紀錄','有控制設施但成效待驗證','局部積水或控制不完整','缺乏必要控制','已記錄泥沙外流或水體受損'],r:'逕流'},
{k:'t',n:'冷卻排熱影響',w:15,c:'#f59e0b',i:'🌡',L:['無直接熱水排放且有紀錄','有降溫並持續監測','排放溫差或影響待確認','有異常升溫紀錄','有升溫及生態損害證據'],r:'排熱'},
{k:'m',n:'監測與治理',w:10,c:'#64748b',i:'📈',L:['定期監測、可追溯並持續改善','定期監測但紀錄不完整','不定期監測','缺乏系統且異常未改善','重大異常未處理或無法追溯'],r:'監測'},
{k:'n',n:'夜間施工干擾',w:5,c:'#4f46e5',i:'🌙',L:['0%','大於 0% 至 10%','大於 10% 至 30%','大於 30% 至 50%','大於 50%'],r:'夜間'}];
const CL=[['損失超過上限',300,250,30,200,80],['損失低於自負額',40,25,30,200,80],['部分保障、自留足夠',150,120,30,200,80]];

let savedHistory = [];
try {
  savedHistory = JSON.parse(localStorage.getItem('aidc_calc_history') || '[]');
} catch(e) { savedHistory = []; }

const S={tab:0,sc:{b:{h:3,v:3,r:3,t:3,m:2,n:3},a:{h:2,v:2,r:3,t:2,m:1,n:2}},soc:{b:70,a:85},gov:{b:70,a:90},L:200,rate:1,cl:0,
ins:{C:300,E:250,D:30,L:200,R:80},rs:{ad:4200,ap:5000,al:452,pl:500,md:11,mp:12},path:'b',own:'',due:'',rev:'',doc:'',docStage:'a',docRes:null,log:[],img:{b:null,a:null},imgDates:{b:'',a:''},roi:{x:0,y:0,w:100,h:100},demoN:0,isDemo:true,imgRes:null,plain:'',tnfd:'',busy:'',err:'',recNote:'',history:savedHistory};

const f=(n,d=2)=>Number(n).toFixed(d);
const calcS=sc=>100*IND.reduce((s,x)=>s+x.w/100*(sc[x.k]-1)/4,0);
const lvl=(s,sc)=>(Object.values(sc).includes(5)||s>=60)?'高':s<30?'低':s<60?'中':'高';
const mult=(q,hi)=>hi?1.6:q>=80?1:q>=60?1.3:1.6;
const Qf=(s,so,go)=>.5*(100-s)+.2*so+.3*go;
function prem(st){const sc=S.sc[st],s=calcS(sc),hi=lvl(s,sc)==='高',q=Qf(s,S.soc[st],S.gov[st]),m=mult(q,hi);return{s,q,m,p:S.L*S.rate/100*m,hi,lv:lvl(s,sc)}}
function claim(x){const I=Math.min(Math.max(x.E-x.D,0),x.L),U=x.C-I,G=Math.max(U-x.R,0);return{I,U,G,cov:U?x.R/U*100:100}}
const pc=l=>l==='低'?'lo':l==='中'?'mi':'hi';
const wan=n=>f(n,1)+'<small> 萬</small>';

function gauge(s,col){const p=Math.min(s,100)/100,a=Math.PI*(1-p),x=100+80*Math.cos(a),y=100-80*Math.sin(a);
return`<svg viewBox="0 0 200 118" width="100%" style="max-width:220px"><path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="#dbeafe" stroke-width="14" stroke-linecap="round"/><path d="M20 100A80 80 0 0 1 ${x} ${y}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round"/><text x="100" y="102" text-anchor="middle" fill="#0f172a" font-size="32" font-weight="800">${f(s)}</text></svg>`}

function radar(){const cx=150,cy=140,R=95,n=6,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+R*v*Math.cos(a),cy+R*v*Math.sin(a)]};
const poly=st=>IND.map((x,i)=>pt(i,S.sc[st][x.k]/5).join(',')).join(' ');
let g=[.2,.4,.6,.8,1].map(v=>`<polygon points="${IND.map((_,i)=>pt(i,v).join(' ')).join(' ')}" fill="none" stroke="#e2e8f0"/>`).join('');
g+=IND.map((x,i)=>{const[a,b]=pt(i,1.22);return`<text x="${a}" y="${b+4}" text-anchor="middle" fill="#64748b" font-size="12">${x.r}</text>`}).join('');
return`<svg viewBox="0 0 300 280" width="100%">${g}<polygon points="${poly('b')}" fill="#64748b22" stroke="#64748b" stroke-width="2"/><polygon points="${poly('a')}" fill="#2563eb22" stroke="#2563eb" stroke-width="2"/></svg>`}

function ringSvg(p,col){const r=36,c=2*Math.PI*r,v=Math.min(Math.max(p,0),100)/100;return`<svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="#f1f5f9" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 42 42)"/></svg>`}
const light=(v,g,y)=>v>=g?['綠燈','#0d9488','lo']:v>=y?['黃燈','#f59e0b','mi']:['紅燈','#f43f5e','hi'];

function summary(){const b=prem('b'),a=prem('a'),cl=claim(S.ins);
$('#sum').innerHTML=`<div class="c"><div class="k"><i class="d" style="background:#64748b"></i>施工前生態分數 S</div><div class="big">${f(b.s)}</div><div class="k">${b.lv}風險</div></div>
<div class="c"><div class="k"><i class="d" style="background:#2563eb"></i>施工後生態分數 S</div><div class="big">${f(a.s)}</div><div class="k">${a.lv}風險</div></div>
<div class="c"><div class="k"><i class="d" style="background:#0d9488"></i>施工後假設年保費</div><div class="big">${wan(a.p)}</div><div class="k">${b.p>=a.p?'比施工前少 '+f(b.p-a.p,1)+' 萬':'比施工前多 '+f(a.p-b.p,1)+' 萬'}</div></div>
<div class="c"><div class="k"><i class="d" style="background:#f43f5e"></i>資金缺口 G</div><div class="big">${wan(cl.G)}</div><div class="k">${cl.G>0?'自留資金不足':'目前無缺口'}</div></div>`}

function tabs(){$('#tabs').innerHTML=['評估','保費','理賠','復育','查核 AI','紀錄'].map((t,i)=>`<button class="${S.tab===i?'on':''}" onclick="S.tab=${i};draw()">${t}</button>`).join('')}
function seg(st,k){return`<div class="seg">${[1,2,3,4,5].map(v=>`<button class="${S.sc[st][k]===v?'on':''}" onclick="S.sc.${st}.${k}=${v};draw()">${v}</button>`).join('')}</div>`}

/* 優化後的評估頁面：施工前與施工後左右並排對照 */
function pAssess(){const b=prem('b'),a=prem('a');
let h=`<h2>六個指標，一眼看懂風險</h2><p class="sec-desc">依 TNFD LEAP 自訂的初步篩選表。左右並排對照施工前後評分，版面更清晰直覺。</p>
<div class="hero-box"><div class="k" style="margin-bottom:10px">生態風險分數 S 總覽</div><div class="gauges"><div>${gauge(b.s,'#64748b')}<div style="font-weight:700;margin-bottom:4px">施工前</div><span class="pill ${pc(b.lv)}">${b.lv}風險</span></div>
<div><div class="k" style="justify-content:center">風險分數變化</div><div class="big" style="font-size:36px;color:var(--blu);justify-content:center">${a.s-b.s>0?'+':'−'}${f(Math.abs(a.s-b.s))}</div><span class="pill ${pc(a.lv)}">${b.lv}風險 → ${a.lv}風險</span></div>
<div>${gauge(a.s,'#2563eb')}<div style="font-weight:700;margin-bottom:4px;color:var(--blu)">施工後</div><span class="pill ${pc(a.lv)}">${a.lv}風險</span></div></div></div><div class="g g2 stack">`;

IND.forEach(x=>{const cb=x.w*(S.sc.b[x.k]-1)/4,ca=x.w*(S.sc.a[x.k]-1)/4,d=cb-ca;
h+=`<div class="c">
  <div class="row">
    <div class="row" style="gap:10px">
      <div class="ic" style="background:${x.c}">${x.i}</div>
      <div>
        <div class="hd">${x.n}</div>
        <div class="k">權重佔比 <b style="color:var(--blu)">${x.w}%</b></div>
      </div>
    </div>
    <div style="text-align:right">
      <span class="pill ${d>0?'lo':d<0?'hi':'gy'}">${d>0?'風險降 '+f(d):d<0?'風險升 '+f(-d):'持平'}</span>
      <div class="k" style="justify-content:flex-end;margin-top:4px">貢獻 ${f(cb)} → <b>${f(ca)}</b></div>
    </div>
  </div>

  <div class="ba-grid">
    <div class="ba-col">
      <div class="row"><b style="color:#475569;font-size:13px">施工前</b><span class="k">${S.sc.b[x.k]} 分</span></div>
      ${seg('b',x.k)}
      <div class="lv">${x.L[S.sc.b[x.k]-1]}</div>
    </div>
    <div class="ba-col after">
      <div class="row"><b style="color:var(--blu);font-size:13px">施工後</b><span class="k" style="color:var(--blu)">${S.sc.a[x.k]} 分</span></div>
      ${seg('a',x.k)}
      <div class="lv" style="color:#1e3a8a">${x.L[S.sc.a[x.k]-1]}</div>
    </div>
  </div>
</div>`});

h+=`</div><div class="fm">S = 100 × Σ〔權重 × (分數 − 1) ÷ 4〕 ｜ S < 30 低｜30 ≤ S < 60 中｜S ≥ 60 高｜任一指標 5 分 → 管理等級升為高</div>

const removalPct=(before,after)=>{if(before===null||before===undefined||after===null||after===undefined)return null;const b=Number(before),a=Number(after);if(!Number.isFinite(b)||!Number.isFinite(a)||b<=0)return null;return (b-a)/b*100};

/* 第 6 頁「紀錄」功能 */
function saveRecord() {
  const b = prem('b'), a = prem('a'), cl = claim(S.ins);
  const rec = {
    id: Date.now(),
    time: new Date().toLocaleString('zh-TW', { hour12: false }),
    note: S.recNote.trim() || '未命名試算方案',
    sb: f(b.s), sa: f(a.s),
    pb: f(b.p, 1), pa: f(a.p, 1),
    gap: f(cl.G, 1),
    snapshot: JSON.parse(JSON.stringify({ sc: S.sc, soc: S.soc, gov: S.gov, L: S.L, rate: S.rate, ins: S.ins, rs: S.rs }))
  };
  S.history.unshift(rec);
  S.recNote = '';
  try { localStorage.setItem('aidc_calc_history', JSON.stringify(S.history)); } catch(e) {}
  draw();
}

function loadRecord(id) {
  const rec = S.history.find(x => x.id === id);
  if (!rec || !rec.snapshot) return;
  Object.assign(S, JSON.parse(JSON.stringify(rec.snapshot)));
  S.tab = 0;
  draw();
}

function delRecord(id) {
  S.history = S.history.filter(x => x.id !== id);
  try { localStorage.setItem('aidc_calc_history', JSON.stringify(S.history)); } catch(e) {}
  draw();
}

function clearRecords() {
  if (!confirm('確定要清空所有歷史試算紀錄嗎？')) return;
  S.history = [];
  try { localStorage.removeItem('aidc_calc_history'); } catch(e) {}
  draw();
}
